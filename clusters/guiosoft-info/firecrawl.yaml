apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firecrawl
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: firecrawl-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/firecrawl

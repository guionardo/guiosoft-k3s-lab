apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  wait: true
  healthCheckExprs:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      failed: has(status.phase) && status.phase == 'Lost'
      current: "true"
  prune: true
  dependsOn:
    - name: keycloak-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/keycloak
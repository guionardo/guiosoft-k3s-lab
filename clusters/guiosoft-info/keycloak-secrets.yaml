apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 1m
  wait: true
  prune: true
  dependsOn:
    - name: keycloak-namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/secrets/keycloak
  decryption:
    provider: sops
    secretRef:
      name: sops-age
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-namespace
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 1m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/namespaces/cloudflare

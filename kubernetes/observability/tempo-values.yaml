# Homelab-oriented Tempo configuration.
# Single-binary mode is intentional for this single-node K3s cluster.

fullnameOverride: tempo
replicas: 1

persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 5Gi

tempo:
  reportingEnabled: false
  retention: 72h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

service:
  type: ClusterIP

serviceMonitor:
  enabled: true
  interval: 30s

# Homelab-oriented values for a single-node K3s cluster.
# Keep the first iteration private: Grafana has no Ingress and is accessed via port-forward.

crds:
  enabled: true
  upgradeJob:
    enabled: true

# K3s currently uses SQLite rather than etcd and does not expose these control-plane
# components as standalone scrape targets in the same way as kubeadm clusters.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false

# kube-prometheus-stack assumes a conventional kube-proxy scrape target by default.
# In this K3s profile that target is not present in Prometheus discovery, so the
# stock KubeProxyDown rule becomes a permanent false positive. Disable both the
# component ServiceMonitor and its default rule instead of hiding a real target failure.
kubeProxy:
  enabled: false

defaultRules:
  rules:
    kubeProxy: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 6GB
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  enabled: true
  ingress:
    enabled: false
  persistence:
    enabled: true
    type: sts
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: browser
  additionalDataSources:
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        nodeGraph:
          enabled: true
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          mappedTags:
            - key: service.name
              value: app
          filterByTraceID: true
          filterBySpanID: false
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        maxLines: 1000
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: "trace_id=([0-9a-f]{32})"
            name: TraceID
            url: '$${__value.raw}'
            urlDisplayLabel: View Trace

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      # CPU limit intentionally omitted. The node-exporter averages only a few
      # millicores but showed >40% CFS throttling with a 200m hard CPU limit,
      # indicating short bursts were being clipped despite ample node capacity.
      # Keep the CPU request for scheduling/QoS and retain only the memory limit.
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

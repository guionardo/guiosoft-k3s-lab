apiVersion: v1
kind: Service
metadata:
  name: planetapeia-api
  namespace: planetapeia
spec:
  selector:
    app: planetapeia-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planetapeia-api
  namespace: planetapeia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planetapeia-api
  template:
    metadata:
      labels:
        app: planetapeia-api
        app.kubernetes.io/part-of: planetapeia
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-db
          image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
          command: ["sh", "-c"]
          args:
            - |
              until MYSQL_PWD="$MARIADB_PASSWORD" mariadb-admin ping -h planetapeia-db -u planetapeia --silent 2>/dev/null; do
                echo "aguardando o banco..."; sleep 2
              done
          env:
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planetapeia-secrets
                  key: MARIADB_PASSWORD
      containers:
        - name: api
          image: ghcr.io/planetapeia/planetapeia-api:sha-09ee78ad7ca0c69e1da7cfc4425d30544c88eee5
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: planetapeia-secrets
          env:
            - name: BACKEND_URL
              value: https://planetapeia.guiosoft.info
            - name: FRONTEND_URL
              value: https://planetapeia.guiosoft.info
            - name: CORS_ORIGINS
              value: https://planetapeia.guiosoft.info
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi

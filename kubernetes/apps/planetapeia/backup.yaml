apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planetapeia-backups
  namespace: planetapeia
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planetapeia-db-backup
  namespace: planetapeia
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dump
              image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  out="/backups/planetapeia-$(date +%Y%m%d-%H%M%S).sql.gz"
                  tmp="/tmp/planetapeia-dump.sql"
                  MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-dump \
                    -h planetapeia-db -u root \
                    --single-transaction --routines --triggers \
                    --default-character-set=utf8mb4 planetapeia > "$tmp"
                  gzip -c "$tmp" > "$out"
                  rm -f "$tmp"
                  find /backups -name 'planetapeia-*.sql.gz' -mtime +14 -delete
              env:
                - name: MARIADB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: planetapeia-secrets
                      key: MARIADB_ROOT_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: planetapeia-backups

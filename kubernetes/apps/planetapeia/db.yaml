apiVersion: v1
kind: Service
metadata:
  name: planetapeia-db
  namespace: planetapeia
spec:
  selector:
    app: planetapeia-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: planetapeia-db
  namespace: planetapeia
spec:
  serviceName: planetapeia-db
  replicas: 1
  selector:
    matchLabels:
      app: planetapeia-db
  template:
    metadata:
      labels:
        app: planetapeia-db
        app.kubernetes.io/part-of: planetapeia
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: planetapeia
            - name: MARIADB_USER
              value: planetapeia
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planetapeia-secrets
                  key: MARIADB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planetapeia-secrets
                  key: MARIADB_ROOT_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-admin ping -uroot
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-admin ping -uroot
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi

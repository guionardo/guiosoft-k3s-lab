apiVersion: v1
kind: Service
metadata:
  name: planetapeia-web
  namespace: planetapeia
spec:
  selector:
    app: planetapeia-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planetapeia-web
  namespace: planetapeia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planetapeia-web
  template:
    metadata:
      labels:
        app: planetapeia-web
        app.kubernetes.io/part-of: planetapeia
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/planetapeia/planetapeia-web:sha-09ee78ad7ca0c69e1da7cfc4425d30544c88eee5
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

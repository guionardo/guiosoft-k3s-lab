apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: registry
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "gc": true,
        "gcInterval": "24h",
        "retention": {
          "delay": "1h",
          "policies": [
            {
              "repositories": ["**"],
              "deleteReferrers": false,
              "keepTags": [
                { "patterns": [".*"], "mostRecentlyPushedCount": 10 }
              ]
            }
          ]
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": { "htpasswd": { "path": "/etc/zot/htpasswd" } }
      },
      "log": { "level": "info" }
    }

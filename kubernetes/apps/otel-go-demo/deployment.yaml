apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-go-demo
  namespace: lab
  labels:
    app: otel-go-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-go-demo
  template:
    metadata:
      labels:
        app: otel-go-demo
    spec:
      containers:
        - name: otel-go-demo
          image: guiosoft/otel-go-demo:dev
          imagePullPolicy: Never
          env:
            - name: SERVICE_NAME
              value: otel-go-demo
            - name: DOWNSTREAM_URL
              value: http://otel-go-downstream.lab.svc.cluster.local:8080/process
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 128Mi

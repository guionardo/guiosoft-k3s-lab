apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: persistence-test
  namespace: lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistence-test
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: persistence-test
  template:
    metadata:
      labels:
        app: persistence-test
    spec:
      containers:
        - name: persistence-test
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ ! -f /data/marker.txt ]; then
                printf 'created-at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /data/marker.txt
              fi
              echo 'Persistent marker:'
              cat /data/marker.txt
              exec sleep 86400
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: persistence-test

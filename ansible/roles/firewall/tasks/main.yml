---
- name: Assert firewall safety inputs
  ansible.builtin.assert:
    that:
      - firewall_lan_interface | length > 0
      - firewall_lan_cidr | length > 0
      - 22 in firewall_lan_tcp_ports
    fail_msg: "Firewall inputs are incomplete; SSH must remain allowed before enforcement."

- name: Ensure nftables include directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render isolated host firewall ruleset
  ansible.builtin.template:
    src: guiosoft-host.nft.j2
    dest: "{{ firewall_ruleset_path }}"
    owner: root
    group: root
    mode: "0644"
  register: firewall_render

- name: Validate rendered ruleset syntax without loading it
  ansible.builtin.command: "nft --check --file {{ firewall_ruleset_path }}"
  changed_when: false

- name: Show staged firewall policy
  ansible.builtin.command: "cat {{ firewall_ruleset_path }}"
  register: firewall_rendered_policy
  changed_when: false

- name: Print staged firewall policy
  ansible.builtin.debug:
    var: firewall_rendered_policy.stdout_lines

- name: Apply isolated host firewall table when explicitly enabled
  ansible.builtin.command: "nft --file {{ firewall_ruleset_path }}"
  when: firewall_enforce | bool
  changed_when: true

- name: Verify isolated table is loaded when enforcing
  ansible.builtin.command: "nft list table inet {{ firewall_table_name }}"
  when: firewall_enforce | bool
  changed_when: false

- name: Remind that staged mode made no live firewall change
  ansible.builtin.debug:
    msg: "firewall_enforce=false: rules were rendered and syntax-checked but NOT loaded."
  when: not firewall_enforce | bool

---
- name: Write K3s server configuration
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      node-name: "{{ k3s_node_name }}"
      data-dir: "{{ k3s_data_dir }}"
      cluster-cidr: "{{ k3s_cluster_cidr }}"
      service-cidr: "{{ k3s_service_cidr }}"
      write-kubeconfig-mode: "{{ k3s_write_kubeconfig_mode }}"
      default-local-storage-path: "{{ storage_local_path_dir }}"
  notify: Restart k3s

- name: Check installed K3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: installed_k3s
  changed_when: false
  failed_when: false

- name: Decide whether K3s installation is required
  ansible.builtin.set_fact:
    install_k3s_required: >-
      {{ installed_k3s.rc != 0 or k3s_version not in installed_k3s.stdout }}

- name: Download official K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/install-k3s.sh
    owner: root
    group: root
    mode: "0755"
  when: install_k3s_required

- name: Install pinned K3s release
  ansible.builtin.command: /usr/local/src/install-k3s.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  when: install_k3s_required
  notify: Restart k3s

- name: Ensure K3s service is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started

- name: Flush handlers before API validation
  ansible.builtin.meta: flush_handlers

- name: Wait for Kubernetes API
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: k3s_ready
  retries: 30
  delay: 2
  until: k3s_ready.rc == 0
  changed_when: false

- name: Determine local Kubernetes admin user
  ansible.builtin.set_fact:
    k3s_effective_admin_user: "{{ k3s_admin_user | default(lookup('env', 'USER'), true) }}"

- name: Resolve Kubernetes admin account
  ansible.builtin.getent:
    database: passwd
    key: "{{ k3s_effective_admin_user }}"

- name: Refuse to install the administrative kubeconfig for root
  ansible.builtin.assert:
    that:
      - k3s_effective_admin_user != 'root'
    fail_msg: >-
      Could not determine the non-root administrative user. Set k3s_admin_user
      explicitly in ansible/inventory/group_vars/all.yml.

- name: Inspect existing kubectl path
  ansible.builtin.stat:
    path: /usr/local/bin/kubectl
  register: kubectl_path

- name: Remove K3s kubectl multicall symlink
  ansible.builtin.file:
    path: /usr/local/bin/kubectl
    state: absent
  when: kubectl_path.stat.islnk | default(false)

- name: Install standalone kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ kubectl_arch }}/kubectl"
    dest: /usr/local/bin/kubectl
    owner: root
    group: root
    mode: "0755"
    checksum: "sha256:https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ kubectl_arch }}/kubectl.sha256"

- name: Ensure administrator kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[k3s_effective_admin_user][4] }}/.kube"
    state: directory
    owner: "{{ k3s_effective_admin_user }}"
    group: "{{ ansible_facts.getent_passwd[k3s_effective_admin_user][2] }}"
    mode: "0700"

- name: Install administrator kubeconfig
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ ansible_facts.getent_passwd[k3s_effective_admin_user][4] }}/.kube/config"
    remote_src: true
    owner: "{{ k3s_effective_admin_user }}"
    group: "{{ ansible_facts.getent_passwd[k3s_effective_admin_user][2] }}"
    mode: "0600"

- name: Validate kubectl as the administrative user
  ansible.builtin.command: /usr/local/bin/kubectl get --raw=/readyz
  become: true
  become_user: "{{ k3s_effective_admin_user }}"
  environment:
    KUBECONFIG: "{{ ansible_facts.getent_passwd[k3s_effective_admin_user][4] }}/.kube/config"
  register: kubectl_ready
  changed_when: false

- name: Read node status
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o wide
  register: k3s_nodes
  changed_when: false

- name: Show node status
  ansible.builtin.debug:
    var: k3s_nodes.stdout_lines

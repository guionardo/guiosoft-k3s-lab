---
- name: Assert Debian host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: "Helm installation currently supports Debian-family hosts only."

- name: Check installed Helm version
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: helm_installed_version
  changed_when: false
  failed_when: false

- name: Decide whether Helm installation is required
  ansible.builtin.set_fact:
    helm_install_required: >-
      {{ helm_installed_version.rc != 0 or helm_version not in helm_installed_version.stdout }}

- name: Create temporary directory for Helm
  ansible.builtin.tempfile:
    state: directory
    prefix: helm-
  register: helm_tmp
  when: helm_install_required

- name: Download pinned Helm archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    dest: "{{ helm_tmp.path }}/helm.tar.gz"
    checksum: "sha256:{{ helm_sha256 }}"
    mode: "0644"
  when: helm_install_required

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: "{{ helm_tmp.path }}/helm.tar.gz"
    dest: "{{ helm_tmp.path }}"
    remote_src: true
  when: helm_install_required

- name: Install Helm binary
  ansible.builtin.copy:
    src: "{{ helm_tmp.path }}/linux-{{ helm_arch }}/helm"
    dest: /usr/local/bin/helm
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: helm_install_required

- name: Remove Helm temporary directory
  ansible.builtin.file:
    path: "{{ helm_tmp.path }}"
    state: absent
  when: helm_install_required

- name: Read installed Helm version
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: helm_version_output
  changed_when: false

- name: Show installed Helm version
  ansible.builtin.debug:
    var: helm_version_output.stdout

---
- name: Assert Debian host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: "Restic installation currently supports Debian-family hosts only."

- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read installed restic version
  ansible.builtin.command: restic version
  register: restic_version_output
  changed_when: false

- name: Show installed restic version
  ansible.builtin.debug:
    var: restic_version_output.stdout

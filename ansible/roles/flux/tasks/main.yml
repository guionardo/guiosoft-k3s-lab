---
- name: Assert Debian host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: "Flux CLI installation currently supports Debian-family hosts only."

- name: Check installed Flux version
  ansible.builtin.command: /usr/local/bin/flux --version
  register: flux_installed_version
  changed_when: false
  failed_when: false

- name: Decide whether Flux installation is required
  ansible.builtin.set_fact:
    flux_install_required: >-
      {{ flux_installed_version.rc != 0 or flux_version not in flux_installed_version.stdout }}

- name: Create temporary directory for Flux
  ansible.builtin.tempfile:
    state: directory
    prefix: flux-
  register: flux_tmp
  when: flux_install_required

- name: Download pinned Flux archive
  ansible.builtin.get_url:
    url: "https://github.com/fluxcd/flux2/releases/download/{{ flux_version }}/flux_{{ flux_version | regex_replace('^v', '') }}_linux_{{ flux_arch }}.tar.gz"
    dest: "{{ flux_tmp.path }}/flux.tar.gz"
    checksum: "sha256:{{ flux_sha256 }}"
    mode: "0644"
  when: flux_install_required

- name: Extract Flux archive
  ansible.builtin.unarchive:
    src: "{{ flux_tmp.path }}/flux.tar.gz"
    dest: "{{ flux_tmp.path }}"
    remote_src: true
  when: flux_install_required

- name: Install Flux binary
  ansible.builtin.copy:
    src: "{{ flux_tmp.path }}/flux"
    dest: /usr/local/bin/flux
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: flux_install_required

- name: Remove Flux temporary directory
  ansible.builtin.file:
    path: "{{ flux_tmp.path }}"
    state: absent
  when: flux_install_required

- name: Read installed Flux version
  ansible.builtin.command: /usr/local/bin/flux --version
  register: flux_version_output
  changed_when: false

- name: Show installed Flux version
  ansible.builtin.debug:
    var: flux_version_output.stdout

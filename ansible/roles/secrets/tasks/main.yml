---
- name: Assert Debian host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: "Secrets tooling installation currently supports Debian-family hosts only."

- name: Install age
  ansible.builtin.apt:
    name: age
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Query latest stable SOPS release
  ansible.builtin.uri:
    url: https://api.github.com/repos/getsops/sops/releases/latest
    return_content: true
  register: sops_latest_release
  changed_when: false

- name: Resolve SOPS architecture
  ansible.builtin.set_fact:
    sops_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts.architecture, ansible_facts.architecture) }}"

- name: Download SOPS binary
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/{{ sops_latest_release.json.tag_name }}/sops-{{ sops_latest_release.json.tag_name }}.linux.{{ sops_arch }}"
    dest: /usr/local/bin/sops
    owner: root
    group: root
    mode: "0755"

- name: Resolve secrets identity user
  ansible.builtin.set_fact:
    secrets_identity_user: "{{ lookup('env', 'USER') }}"

- name: Resolve secrets identity user home
  ansible.builtin.getent:
    database: passwd
    key: "{{ secrets_identity_user }}"

- name: Set secrets identity paths
  ansible.builtin.set_fact:
    secrets_identity_home: "{{ ansible_facts.getent_passwd[secrets_identity_user][4] }}"
    secrets_age_dir: "{{ ansible_facts.getent_passwd[secrets_identity_user][4] }}/.config/sops/age"
    secrets_age_identity_file: "{{ ansible_facts.getent_passwd[secrets_identity_user][4] }}/.config/sops/age/keys.txt"

- name: Create SOPS age configuration directory
  ansible.builtin.file:
    path: "{{ secrets_age_dir }}"
    state: directory
    owner: "{{ secrets_identity_user }}"
    mode: "0700"

- name: Generate age identity when absent
  ansible.builtin.command:
    cmd: "age-keygen -o {{ secrets_age_identity_file }}"
    creates: "{{ secrets_age_identity_file }}"
  become_user: "{{ secrets_identity_user }}"
  environment:
    HOME: "{{ secrets_identity_home }}"

- name: Protect age identity file
  ansible.builtin.file:
    path: "{{ secrets_age_identity_file }}"
    state: file
    owner: "{{ secrets_identity_user }}"
    mode: "0600"

- name: Read age public recipient
  ansible.builtin.command:
    cmd: "age-keygen -y {{ secrets_age_identity_file }}"
  become_user: "{{ secrets_identity_user }}"
  register: age_public_recipient
  changed_when: false

- name: Validate secrets tooling
  ansible.builtin.command: "{{ item }}"
  loop:
    - age --version
    - sops --version
  register: secrets_tool_versions
  changed_when: false

- name: Show secrets tooling versions and public recipient
  ansible.builtin.debug:
    msg:
      - "{{ secrets_tool_versions.results | map(attribute='stdout') | list }}"
      - "age recipient: {{ age_public_recipient.stdout }}"
      - "Back up {{ secrets_age_identity_file }} off-host before relying on it for irreplaceable secrets."

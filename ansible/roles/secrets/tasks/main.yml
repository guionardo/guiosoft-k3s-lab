---
- name: Assert Debian host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: "Secrets tooling installation currently supports Debian-family hosts only."

- name: Install age
  ansible.builtin.apt:
    name: age
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Query latest stable SOPS release
  ansible.builtin.uri:
    url: https://api.github.com/repos/getsops/sops/releases/latest
    return_content: true
  register: sops_latest_release
  changed_when: false

- name: Resolve SOPS architecture
  ansible.builtin.set_fact:
    sops_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts.architecture, ansible_facts.architecture) }}"

- name: Download SOPS binary
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/{{ sops_latest_release.json.tag_name }}/sops-{{ sops_latest_release.json.tag_name }}.linux.{{ sops_arch }}"
    dest: /usr/local/bin/sops
    owner: root
    group: root
    mode: "0755"

- name: Validate secrets tooling
  ansible.builtin.command: "{{ item }}"
  loop:
    - age --version
    - sops --version
  register: secrets_tool_versions
  changed_when: false

- name: Show secrets tooling versions
  ansible.builtin.debug:
    msg: "{{ secrets_tool_versions.results | map(attribute='stdout') | list }}"

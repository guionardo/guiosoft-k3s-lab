---
- name: Verify backup storage mount exists
  ansible.builtin.command: "mountpoint -q {{ storage_backup_mount }}"
  register: backup_mount_check
  changed_when: false
  failed_when: false

- name: Refuse backup automation when backup disk is not mounted
  ansible.builtin.assert:
    that:
      - backup_mount_check.rc == 0
    fail_msg: >-
      Expected backup mount {{ storage_backup_mount }} is not available. Refusing to
      install the scheduled backup because it could silently write to the root filesystem.

- name: Validate backup retention policy
  ansible.builtin.assert:
    that:
      - k3s_backup_keep | int >= 2
      - restic_r2_keep_daily | int >= 1
      - restic_r2_keep_weekly | int >= 1
      - restic_r2_keep_monthly | int >= 1
    fail_msg: "Backup retention values are invalid."

- name: Create K3s backup directory
  ansible.builtin.file:
    path: "{{ k3s_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Verify Restic R2 runtime configuration exists
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ restic_r2_config_dir }}/restic.repository"
    - "{{ restic_r2_config_dir }}/restic.password"
    - "{{ restic_r2_config_dir }}/r2.env"
  register: restic_r2_config_files
  when: restic_r2_enabled | bool

- name: Refuse off-host automation without installed Restic R2 credentials
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.size | int > 0
    fail_msg: >-
      Restic R2 runtime configuration is missing. Run make restic-r2-install before
      enabling scheduled off-host backups.
  loop: "{{ restic_r2_config_files.results }}"
  when: restic_r2_enabled | bool

- name: Install K3s backup scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/{{ item.src }}"
    dest: "/usr/local/sbin/{{ item.dest }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - { src: k3s-backup.sh, dest: k3s-backup }
    - { src: k3s-backup-prune.sh, dest: k3s-backup-prune }
    - { src: k3s-backup-run.sh, dest: k3s-backup-run }

- name: Install Restic R2 scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/{{ item.src }}"
    dest: "/usr/local/sbin/{{ item.dest }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - { src: restic-r2-sync.sh, dest: restic-r2-sync }
    - { src: k3s-restic-maintenance.sh, dest: k3s-restic-maintenance }
  when: restic_r2_enabled | bool

- name: Install consistent-backup scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/{{ item.src }}"
    dest: "/usr/local/sbin/{{ item.dest }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - { src: k3s-consistent-backup-run.sh, dest: k3s-consistent-backup-run }
    - { src: k3s-consistent-backup.sh, dest: k3s-consistent-backup }
    - { src: k3s-consistent-backup-readiness.sh, dest: k3s-consistent-backup-readiness }
    - { src: k3s-consistent-backup-verify.sh, dest: k3s-consistent-backup-verify }
    - { src: k3s-backup.sh, dest: k3s-backup }
    - { src: k3s-backup-verify.sh, dest: k3s-backup-verify }
    - { src: restic-r2-sync.sh, dest: restic-r2-sync }
    - { src: k3s-pv-backup-r2.sh, dest: k3s-pv-backup-r2 }
    - { src: k3s-restic-maintenance.sh, dest: k3s-restic-maintenance }
  when: k3s_consistent_backup_enabled | bool

- name: Install K3s backup service
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-backup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Backup K3s SQLite datastore and server token
      Documentation=https://docs.k3s.io/datastore/backup-restore
      Wants=network-online.target
      After=network-online.target k3s.service

      [Service]
      Type=oneshot
      Environment=K3S_DATA_DIR={{ k3s_data_dir }}
      Environment=K3S_BACKUP_DIR={{ k3s_backup_dir }}
      Environment=K3S_BACKUP_KEEP={{ k3s_backup_keep }}
      Environment=RESTIC_CONFIG_DIR={{ restic_r2_config_dir }}
      Environment=RESTIC_R2_KEEP_DAILY={{ restic_r2_keep_daily }}
      Environment=RESTIC_R2_KEEP_WEEKLY={{ restic_r2_keep_weekly }}
      Environment=RESTIC_R2_KEEP_MONTHLY={{ restic_r2_keep_monthly }}
      Environment=RESTIC_R2_ENABLED={{ 1 if restic_r2_enabled | bool else 0 }}
      ExecStart=/usr/local/sbin/k3s-backup-run
      Nice=10
      IOSchedulingClass=best-effort
      IOSchedulingPriority=7
      PrivateTmp=true
      NoNewPrivileges=true
  notify: Reload systemd

- name: Install K3s backup timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-backup.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run K3s backup daily

      [Timer]
      OnCalendar={{ k3s_backup_on_calendar }}
      Persistent=true
      RandomizedDelaySec={{ k3s_backup_randomized_delay }}
      Unit=k3s-backup.service

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Install consistent recovery-set service
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-consistent-backup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Create, verify, and maintain a bounded-consistency K3s recovery set
      Wants=network-online.target
      After=network-online.target k3s.service

      [Service]
      Type=oneshot
      Environment=GUIOSOFT_K3S_REPO_ROOT=/usr/local/lib/guiosoft-k3s-backup
      Environment=RESTIC_CONFIG_DIR={{ restic_r2_config_dir }}
      Environment=RESTIC_R2_KEEP_DAILY={{ restic_r2_keep_daily }}
      Environment=RESTIC_R2_KEEP_WEEKLY={{ restic_r2_keep_weekly }}
      Environment=RESTIC_R2_KEEP_MONTHLY={{ restic_r2_keep_monthly }}
      ExecStart=/usr/local/sbin/k3s-consistent-backup-run
      ExecStart=/usr/local/sbin/k3s-consistent-backup-verify
      ExecStart=/usr/local/sbin/k3s-restic-maintenance
      Nice=10
      IOSchedulingClass=best-effort
      IOSchedulingPriority=7
      PrivateTmp=true
      NoNewPrivileges=true
  when: k3s_consistent_backup_enabled | bool
  notify: Reload systemd

- name: Install consistent recovery-set timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-consistent-backup.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run bounded-consistency K3s recovery set backup weekly

      [Timer]
      OnCalendar={{ k3s_consistent_backup_on_calendar }}
      Persistent=true
      RandomizedDelaySec={{ k3s_consistent_backup_randomized_delay }}
      Unit=k3s-consistent-backup.service

      [Install]
      WantedBy=timers.target
  when: k3s_consistent_backup_enabled | bool
  notify: Reload systemd

- name: Install self-contained consistent-backup script directory
  ansible.builtin.file:
    path: /usr/local/lib/guiosoft-k3s-backup/scripts
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: k3s_consistent_backup_enabled | bool

- name: Install orchestrator dependencies in self-contained directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/{{ item }}"
    dest: "/usr/local/lib/guiosoft-k3s-backup/scripts/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - k3s-consistent-backup.sh
    - k3s-consistent-backup-readiness.sh
    - k3s-consistent-backup-verify.sh
    - k3s-backup.sh
    - k3s-backup-verify.sh
    - restic-r2-sync.sh
    - k3s-pv-backup-r2.sh
    - k3s-restic-maintenance.sh
  when: k3s_consistent_backup_enabled | bool

- name: Flush systemd reload before enabling timers
  ansible.builtin.meta: flush_handlers

- name: Enable and start K3s backup timer
  ansible.builtin.systemd:
    name: k3s-backup.timer
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Enable and start consistent recovery-set timer
  ansible.builtin.systemd:
    name: k3s-consistent-backup.timer
    enabled: true
    state: started
  when:
    - k3s_consistent_backup_enabled | bool
    - not ansible_check_mode

- name: Read K3s backup timer state
  ansible.builtin.command: systemctl list-timers k3s-backup.timer --no-pager
  register: backup_timer_state
  changed_when: false
  when: not ansible_check_mode

- name: Read consistent recovery-set timer state
  ansible.builtin.command: systemctl list-timers k3s-consistent-backup.timer --no-pager
  register: consistent_backup_timer_state
  changed_when: false
  when:
    - k3s_consistent_backup_enabled | bool
    - not ansible_check_mode

- name: Show K3s backup timer summary
  ansible.builtin.debug:
    msg:
      - "Backup directory: {{ k3s_backup_dir }}"
      - "Local retention: keep {{ k3s_backup_keep }} complete archives"
      - "Off-host Restic R2 enabled: {{ restic_r2_enabled }}"
      - "Remote retention: {{ restic_r2_keep_daily }} daily / {{ restic_r2_keep_weekly }} weekly / {{ restic_r2_keep_monthly }} monthly"
      - "Daily schedule: {{ k3s_backup_on_calendar }} with random delay {{ k3s_backup_randomized_delay }}"
      - "Consistent recovery-set enabled: {{ k3s_consistent_backup_enabled }}"
      - "Consistent schedule: {{ k3s_consistent_backup_on_calendar }} with random delay {{ k3s_consistent_backup_randomized_delay }}"
      - "{{ backup_timer_state.stdout_lines | default(['dry-run: timer state not queried']) }}"
      - "{{ consistent_backup_timer_state.stdout_lines | default(['dry-run: timer state not queried']) }}"

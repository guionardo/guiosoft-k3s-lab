---
# Disabled in production: this file is NOT imported by roles/samba_host/tasks/main.yml.
# Do not integrate before reviewing the local tests and approving a host change.
- name: Explicitly authorize historical fstab stage
  ansible.builtin.assert:
    that:
      - samba_apply | default(false) | bool
      - samba_fstab_apply | default(false) | bool
      - samba_fstab_confirm | default('') == 'APLICAR_FSTAB_HISTORICO'
    fail_msg: "fstab stage blocked until separately authorized"

- name: Stage isolated transaction helper outside fstab
  ansible.builtin.copy:
    src: "{{ role_path }}/../../scripts/historical_fstab_transaction.py"
    dest: /tmp/samba-historical-fstab-transaction.py
    mode: '0700'
  become: true

- name: Preview historical fstab changes
  ansible.builtin.command:
    argv: [python3, /tmp/samba-historical-fstab-transaction.py, --fstab, /etc/fstab]
  register: samba_fstab_preview
  changed_when: false
  become: true

- name: Show dry-run decision
  ansible.builtin.debug:
    var: samba_fstab_preview.stdout

# This file deliberately stops before write: application requires a separate
# explicit review after local fixture tests and findmnt verification on Debian 13.
- name: Refuse unvalidated host write
  ansible.builtin.fail:
    msg: "No production fstab writing enabled. Review transaction helper and test evidence first."

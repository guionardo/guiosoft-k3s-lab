all:
  children:
    k3s_servers:
      children:
        dr:
          hosts:
            dr-k3s:
              ansible_host: 192.0.2.10
              ansible_user: debian
              ansible_python_interpreter: /usr/bin/python3
              k3s_node_name: dr-k3s
              k3s_admin_user: debian

# Example only. Copy to the ignored dr.yml and replace address/user.
# Keep the `dr` group: it loads fail-closed DR defaults and prevents inheritance
# of production storage, backup/R2 and cloudflared policy.
# Never point a DR rehearsal inventory at the production host or production IP.

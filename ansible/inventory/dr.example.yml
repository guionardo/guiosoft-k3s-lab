all:
  children:
    k3s_servers:
      hosts:
        dr-k3s:
          ansible_host: 192.0.2.10
          ansible_user: debian
          ansible_python_interpreter: /usr/bin/python3
          k3s_node_name: dr-k3s
          k3s_admin_user: debian
          k3s_data_dir: /var/lib/rancher/k3s
          storage_local_path_dir: /var/lib/rancher/k3s/storage
          preserve_docker: true
          preserve_cloudflared: false

# Example only. Copy to an ignored local inventory and replace the address/user.
# Never point a DR rehearsal inventory at the production host or production IP.

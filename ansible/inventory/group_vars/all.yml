---
# Variables shared by every K3s environment. Environment-specific storage,
# backup, off-host credentials policy, node identity and service-preservation
# decisions belong in group_vars/prod.yml or group_vars/dr.yml.

# Keep cluster networking away from the existing Docker bridge ranges (172.17-21.0.0/16).
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Current stable release pinned for reproducible rebuilds.
k3s_version: v1.36.4+k3s1
kubectl_version: v1.36.4
kubectl_arch: amd64

# Cryptographic tools used by SOPS recovery and GitOps bootstrap.
sops_version: v3.13.3
sops_arch: amd64

# Helm is used for cluster add-ons such as kube-prometheus-stack.
helm_version: v4.3.0
helm_arch: amd64
helm_sha256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb

# Flux is the GitOps controller selected for Fase 7.
flux_version: v2.9.5
flux_arch: amd64
flux_sha256: b853df82adfd7736f580692f9f734473d571606307139f8fd20c2a80dd1ff473

k3s_data_dir: /var/lib/rancher/k3s
k3s_write_kubeconfig_mode: "0640"

base_packages:
  - ca-certificates
  - curl
  - jq
  - iproute2
  - iptables
  - nftables
  - socat
  - conntrack

---
# Keep cluster networking away from the existing Docker bridge ranges (172.17-21.0.0/16).
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Current stable release pinned for reproducible rebuilds.
k3s_version: v1.36.4+k3s1
kubectl_version: v1.36.4
kubectl_arch: amd64

# Helm is used for cluster add-ons such as kube-prometheus-stack.
helm_version: v4.3.0
helm_arch: amd64
helm_sha256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb

k3s_node_name: guiosoft-info
k3s_data_dir: /var/lib/rancher/k3s
k3s_write_kubeconfig_mode: "0640"

# Storage layout. Existing filesystems are reused in place; this role does not format,
# repartition, mount, move, or delete existing data.
storage_primary_mount: /mnt/store1
storage_backup_mount: /mnt/store2
storage_root: /srv/k3s
storage_primary_root: /mnt/store1/k3s
storage_backup_root: /mnt/store2/k3s
storage_local_path_dir: /mnt/store1/k3s/local-path
storage_persistent_dir: /mnt/store1/k3s/persistent
storage_backup_dir: /mnt/store2/k3s/backups

# K3s control-plane backup policy. The timer uses the server's local timezone.
k3s_backup_dir: /srv/k3s/backups/k3s
k3s_backup_keep: 14
k3s_backup_on_calendar: "*-*-* 03:15:00"
k3s_backup_randomized_delay: 15m

# Off-host Restic repository in Cloudflare R2. Runtime credentials stay under
# /etc/k3s-backup and are installed from the SOPS-encrypted repository secret.
restic_r2_enabled: true
restic_r2_config_dir: /etc/k3s-backup
restic_r2_keep_daily: 14
restic_r2_keep_weekly: 8
restic_r2_keep_monthly: 12

# Existing workloads/services that must not be modified by the bootstrap.
preserve_docker: true
preserve_cloudflared: true

base_packages:
  - ca-certificates
  - curl
  - jq
  - iproute2
  - iptables
  - nftables
  - socat
  - conntrack

---
# Keep cluster networking away from the existing Docker bridge ranges (172.17-21.0.0/16).
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Current stable release pinned for reproducible rebuilds.
k3s_version: v1.36.4+k3s1
kubectl_version: v1.36.4
kubectl_arch: amd64

k3s_node_name: guiosoft-info
k3s_data_dir: /var/lib/rancher/k3s
k3s_write_kubeconfig_mode: "0640"

# Existing workloads/services that must not be modified by the bootstrap.
preserve_docker: true
preserve_cloudflared: true

base_packages:
  - ca-certificates
  - curl
  - jq
  - iproute2
  - iptables
  - nftables
  - socat
  - conntrack

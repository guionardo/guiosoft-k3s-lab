---
- name: Persist validated host firewall policy across reboot
  hosts: k3s_servers
  become: true
  gather_facts: true

  vars:
    firewall_enforce: false
    firewall_persist: true

  roles:
    - firewall

  post_tasks:
    - name: Verify firewall table remains loaded
      ansible.builtin.command: nft list table inet guiosoft_host
      changed_when: false

    - name: Verify persistent loader is enabled
      ansible.builtin.command: systemctl is-enabled guiosoft-host-firewall.service
      register: firewall_persist_enabled
      changed_when: false
      failed_when: firewall_persist_enabled.stdout | trim != 'enabled'

    - name: Show persistence status
      ansible.builtin.debug:
        msg:
          - "Validated firewall policy is still live."
          - "guiosoft-host-firewall.service is enabled for future boots."
          - "This playbook does not reload the live ruleset; persistence will be exercised on the next reboot."

---
- name: Enforce and validate disabled host services
  hosts: k3s_servers
  become: true
  gather_facts: false

  tasks:
    - name: Stop and disable unused host services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ host_disabled_services | default([]) }}"

    - name: Read enabled state of hardened services
      ansible.builtin.command: systemctl is-enabled {{ item }}
      register: host_hardening_enabled
      changed_when: false
      failed_when: false
      loop: "{{ host_disabled_services | default([]) }}"

    - name: Read active state of hardened services
      ansible.builtin.command: systemctl is-active {{ item }}
      register: host_hardening_active
      changed_when: false
      failed_when: false
      loop: "{{ host_disabled_services | default([]) }}"

    - name: Assert hardened services are not enabled
      ansible.builtin.assert:
        that:
          - item.stdout in ['disabled', 'masked', 'static', 'indirect', 'not-found']
        fail_msg: "{{ item.item }} is still enabled ({{ item.stdout | default('unknown') }})."
      loop: "{{ host_hardening_enabled.results }}"

    - name: Assert hardened services are not active
      ansible.builtin.assert:
        that:
          - item.stdout != 'active'
        fail_msg: "{{ item.item }} is still active."
      loop: "{{ host_hardening_active.results }}"

    - name: Show hardened service state
      ansible.builtin.debug:
        msg: >-
          {{ item.0.item }}: enabled={{ item.0.stdout | default('unknown') }},
          active={{ item.1.stdout | default('unknown') }}
      loop: "{{ host_hardening_enabled.results | zip(host_hardening_active.results) | list }}"

---
- name: Classify host network exposure before firewall enforcement
  hosts: k3s_servers
  become: true
  gather_facts: true

  vars:
    firewall_expected_lan_cidr: "{{ firewall_lan_cidr | default('192.168.88.0/24') }}"
    firewall_relevant_ports:
      - 22
      - 80
      - 443
      - 6443
      - 8472
      - 9100
      - 10250

  tasks:
    - name: Assert the expected LAN CIDR is explicitly known
      ansible.builtin.assert:
        that:
          - firewall_expected_lan_cidr | length > 0
        fail_msg: "Define firewall_lan_cidr before creating enforcement rules."

    - name: Read IPv4 addresses
      ansible.builtin.command: ip -4 -brief address show
      register: firewall_ip_addresses
      changed_when: false

    - name: Read IPv4 routes
      ansible.builtin.command: ip -4 route show
      register: firewall_routes
      changed_when: false

    - name: Read TCP listeners with process information
      ansible.builtin.command: ss -lntp
      register: firewall_tcp_listeners
      changed_when: false

    - name: Read UDP listeners with process information
      ansible.builtin.command: ss -lnup
      register: firewall_udp_listeners
      changed_when: false

    - name: Read current nftables ruleset
      ansible.builtin.command: nft list ruleset
      register: firewall_nft_ruleset
      changed_when: false
      failed_when: false

    - name: Read Docker networks
      ansible.builtin.command: docker network ls --format {% raw %}'{{.Name}} {{.Driver}}'{% endraw %}
      register: firewall_docker_networks
      changed_when: false
      failed_when: false

    - name: Read K3s node addresses
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o wide
      register: firewall_k3s_nodes
      changed_when: false

    - name: Read services exposed outside ClusterIP
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl get services -A
        -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,TYPE:.spec.type,CLUSTER-IP:.spec.clusterIP,EXTERNAL-IP:.status.loadBalancer.ingress[*].ip,PORTS:.spec.ports[*].port
      register: firewall_k3s_services
      changed_when: false

    - name: Read ingress hostnames
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl get ingress -A
        -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,HOSTS:.spec.rules[*].host,CLASS:.spec.ingressClassName
      register: firewall_k3s_ingresses
      changed_when: false

    - name: Check router-facing port forwards with local nftables evidence
      ansible.builtin.debug:
        msg: >-
          Router/NAT rules cannot be proven from this host. Confirm separately on MikroTik
          that there are no unsolicited Internet port-forwards to {{ ansible_default_ipv4.address }}.

    - name: Show classification evidence
      ansible.builtin.debug:
        msg:
          - "Expected LAN CIDR: {{ firewall_expected_lan_cidr }}"
          - "Host IPv4: {{ firewall_ip_addresses.stdout_lines }}"
          - "Routes: {{ firewall_routes.stdout_lines }}"
          - "Relevant policy ports: {{ firewall_relevant_ports }}"
          - "TCP listeners: {{ firewall_tcp_listeners.stdout_lines }}"
          - "UDP listeners: {{ firewall_udp_listeners.stdout_lines }}"
          - "K3s nodes: {{ firewall_k3s_nodes.stdout_lines }}"
          - "K3s services: {{ firewall_k3s_services.stdout_lines }}"
          - "Ingresses: {{ firewall_k3s_ingresses.stdout_lines }}"
          - "Docker networks: {{ firewall_docker_networks.stdout_lines | default([]) }}"
          - "nftables ruleset lines: {{ firewall_nft_ruleset.stdout_lines | default([]) | length }}"

# This playbook is intentionally read-only. Its output is the evidence gate for
# the firewall role. Do not implement a default-deny policy until the observed
# origins for SSH, Kubernetes API, kubelet, node-exporter, Traefik and Flannel
# have been reconciled with docs/firewall.md and the MikroTik NAT configuration.
